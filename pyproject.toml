[project]
name = "dotfiles-installer"
version = "0.1.0"
description = "A CLI tool to install dotfiles and scripts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "questionary>=2.0.0",
    "rich>=13.0.0"
]

[project.scripts]
install-snippets = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
