name: flotilla
root: ~/projects/robotics/

windows:
  - my-task-board:
      panes:
        - cd my-task-board && kanmd .
  - run-broker:
      panes:
        - cd flotilla && docker compose up broker aspire-dashboard
  - run-flotilla-frontend:
      panes:
        - cd flotilla/frontend && npm run start
  - run-flotilla-backend:
      panes:
        - cd flotilla/backend && dotnet run --project api
  - run-isar:
      panes:
        - cd isar && python main.py
  - run-sara:
      panes:
        - cd sara/api && dotnet run
  - robotics-infrastructure:
      panes:
        - cd robotics-infrastructure
  - analytics-infrastructure:
      panes:
        - cd analytics-infrastructure
  - sara-thermal-reading:
      panes:
        - cd sara-thermal-reading
  - sara-anonymizer:
      panes:
        - cd sara-anonymizer
